<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram-style Chat App</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- use local server to host while testing -->
    <!-- personally used http-server with node.js -->
    
    <div class="chat-app">
        <!-- Chat Header -->
        <header class="chat-header">
            <h2 id="chat-room-title">Chat Room</h2>
            <span class="username-display" id="username-display">Username: </span>
        </header>

        <!-- Note: this setup section is to-be removed, i.e. it is present for testing purposes only -->
        <!-- In the deployed web app, the logged-in user's ID and the group's ID should be used instead -->
        <!-- Setup Section for joining a room -->
        <div class="setup-section">
            <label for="username">Username:</label>
            <input type="text" id="username" placeholder="Enter your username">

            <label for="chat-room">Chat Room:</label>
            <input type="text" id="chat-room" placeholder="Enter chat room name">
            <button id="join-room">Join Room</button>
        </div>

        <!-- Main Chat Window -->
        <div id="chat-window" class="chat-window">
            <div id="messages" class="messages"></div>
        </div>

        <!-- Message Input Section -->
        <div class="input-section">
            <input type="text" id="message-input" placeholder="Type a message...">
            <button id="send-btn">Send</button>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <!-- Note: -compat files for direct browser usage without modules -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="script.js"></script>
</body>

</html>
